[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-particle-system"
version = "0.1.0"
description = "Correctness-first core for a stochastic particle collection benchmark."
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26", "PyYAML>=6.0"]

[project.optional-dependencies]
marl = ["torch>=2.0", "gymnasium>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]
