name: sps-marl
# CPU-only PyTorch: ShARC HPC has CUDA 11.2 which is too old for PyTorch 2.x GPU builds.
# The training bottleneck is NumPy environment simulation, not MLP compute, so CPU is fine.
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.26
  - pyyaml>=6.0
  - pip
  - pip:
    - torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
    - -e ..
