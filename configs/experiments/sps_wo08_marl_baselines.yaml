experiment_id: SPS-WO-08-MARL-BASELINES

# Frozen environment parameters — do not change after first run.
env:
  horizon: 67                  # same endpoint as SPS-C03
  signal_strength: 0.06        # confirmed alpha from SPS-C03
  particle_count: 256          # benchmark default
  collector_count: 4           # benchmark default

# Seed firewall
# Training seeds 8001-8008 are reserved exclusively for SPS-WO-08 training.
# Eval seeds 9001-9008 are reserved exclusively for SPS-WO-08 evaluation.
# Neither range may be used for any other experiment.
seeds:
  training: [8001, 8002, 8003, 8004, 8005, 8006, 8007, 8008]
  evaluation: [9001, 9002, 9003, 9004, 9005, 9006, 9007, 9008]

# MARL architectures to benchmark
architectures:
  - ippo
  - mappo
  - commnet
  - coma
  - vdn
  - maddpg

onpolicy_archs: [ippo, mappo, commnet, coma, vdn]
offpolicy_archs: [maddpg]

# Training budgets
training:
  n_episodes: 20000        # on-policy (IPPO, MAPPO, CommNet, COMA, VDN)
  n_steps: 500000          # off-policy (MADDPG)
  checkpoint_every_episodes: 2000    # saves 10 checkpoints per run
  checkpoint_every_steps: 50000      # saves 10 checkpoints for MADDPG

# Scripted baselines evaluated on every eval seed for direct comparison
scripted_baselines:
  - stationary
  - capacity_matched_independent
  - shared_summary_v2                # SPS-C03 confirmed coordination arm
  - full_state_interception_oracle   # ceiling

# HPC resource request (ShARC, PBS scheduler)
hpc:
  queue: gpu
  ncpus: 8
  ngpus: 1
  walltime: 24:00:00
  n_jobs_total: 48           # 6 archs × 8 seeds
  expected_concurrent: 4     # 4 V100 GPUs available
  expected_queue_days: 3-4

# Output paths
output:
  per_seed_dir: results/raw/SPS-WO-08-MARL
  per_seed_pattern: "{arch}_seed{seed}.json"
  checkpoint_dir: results/raw/SPS-WO-08-MARL/checkpoints/{arch}_seed{seed}
  aggregate_report: results/sps-wo-08-marl-baselines-aggregate.json
  hpc_logs: hpc/logs

# Upstream gate requirements (must be satisfied before results are interpretable)
upstream_gates:
  - id: SPS-WO-06
    description: timestep convergence confirmed
    status: passed
  - id: SPS-C03
    description: coordination mechanism gate passed
    status: passed
  - id: SPS-WO-07C
    description: ablation gate (informative failure — does not block MARL)
    status: informative_failure

# Notes
notes: |
  CPU-only PyTorch 2.1.0 is used because ShARC HPC has CUDA 11.2 which is
  incompatible with PyTorch 2.x GPU builds (requires CUDA 11.7+).
  The training bottleneck is NumPy environment simulation (~85 steps/s), not
  MLP forward/backward passes, so CPU-only is acceptable.

  Each PBS job trains one (arch, seed) independently and writes a
  self-contained JSON result.  After all 48 jobs complete, run
  analysis/aggregate_marl_results.py to merge results into the full report.
