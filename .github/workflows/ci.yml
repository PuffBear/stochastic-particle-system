name: validation

on:
  pull_request:
  push:
    branches: [main, research-autonomy]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Compile source and tests
        run: python -m compileall -q src analysis tests
      - name: Run dependency-free tests
        run: >-
          PYTHONPATH=src:.
          python -m unittest
          tests.test_contact_semantics
          tests.test_core
          tests.test_environment
          tests.test_inference
          tests.test_io
          tests.test_policies
          tests.test_refinement
          tests.test_runner
          tests.test_schemas
          tests.test_yield_gate
          tests.test_experiment_design
          -q

  marl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[marl-test]"
      - name: Run MARL and coordination tests
        run: PYTHONPATH=src:. pytest -q tests/test_coordination.py tests/test_marl.py
